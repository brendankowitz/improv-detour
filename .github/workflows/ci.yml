name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run verify
      # The e2e suite builds and serves dist/ itself, against a phone viewport.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
